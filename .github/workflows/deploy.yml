name: Deploy

# Runs after CI passes on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip if deploy credentials are not set up yet
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT secret is not set; skipping deploy."

      - uses: actions/checkout@v5
        if: env.HAS_CREDENTIALS == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        if: env.HAS_CREDENTIALS == 'true'
        with: { node-version: 22 }
      - name: Install
        if: env.HAS_CREDENTIALS == 'true'
        run: npm ci && npm ci --prefix functions

      - name: Build the web app
        if: env.HAS_CREDENTIALS == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || secrets.API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || secrets.AUTHDOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.PROJECTID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || secrets.STORAGEBUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.MESSAGINGSENDERID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || secrets.APPID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY || secrets.VAPID_KEY }}
        run: npm run build

      - name: Authenticate to Google Cloud
        if: env.HAS_CREDENTIALS == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Store the Anthropic API key in Secret Manager
        if: env.HAS_CREDENTIALS == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/anthropic.txt"
            npx firebase functions:secrets:set ANTHROPIC_API_KEY --data-file "$RUNNER_TEMP/anthropic.txt" --force --non-interactive
            rm -f "$RUNNER_TEMP/anthropic.txt"
          else
            echo "::warning::ANTHROPIC_API_KEY secret is not set; receipt reading will not work."
          fi

      - name: Deploy hosting, Firestore rules and Cloud Functions
        if: env.HAS_CREDENTIALS == 'true'
        run: npx firebase deploy --only hosting,firestore,functions --force --non-interactive

      - name: Remove credentials file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
